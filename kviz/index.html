<head>

<title>Kviz: Sladkorna bolezen</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--tx:#1d2733;--mut:#6b7a8c;--pri:#2563eb;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--bd:#d6dee9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#1a222d;--tx:#e8eef5;--mut:#93a1b3;--pri:#5b8cff;--ok:#4ade80;--okbg:#10341f;--bad:#f87171;--badbg:#3b1717;--bd:#2c3846}}
:root[data-theme="dark"]{--bg:#10151c;--card:#1a222d;--tx:#e8eef5;--mut:#93a1b3;--pri:#5b8cff;--ok:#4ade80;--okbg:#10341f;--bad:#f87171;--badbg:#3b1717;--bd:#2c3846}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.th{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;flex:none}
.th button{background:var(--card);color:var(--mut);border:0;padding:7px 11px;cursor:pointer;font-size:.9rem}
.th button.on{background:var(--pri);color:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:12px 0}
.mut{color:var(--mut);font-size:.9rem}
label{display:block;margin:10px 0 4px;font-weight:600}
select,button{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.4;cursor:default}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 14px}
.bar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default;color:var(--tx)}
.opt b{display:inline-block;width:1.6em;color:var(--mut)}
.fb{margin:12px 0;padding:10px 12px;border-radius:10px;font-weight:600}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb small{display:block;font-weight:400;color:var(--tx);margin-top:4px}
.hide{display:none}
.li{border-top:1px solid var(--bd);padding:12px 0}
.li .lq{font-weight:600;margin-bottom:6px}
.li .lo{padding:3px 8px;margin:2px 0;border-radius:8px;color:var(--mut)}
.li .lo.ok{background:var(--okbg);color:var(--ok);font-weight:600}
.li .lp{font-size:.85rem;color:var(--mut);margin-top:4px}
.big{font-size:2.4rem;font-weight:700;text-align:center;margin:6px 0}
ul.wr{padding-left:18px}ul.wr li{margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
</style>
</head>

<script>
(function(){
var ALL=[], cur=[], idx=0, score=0, wrongs=[], locked=false;
var $=function(i){return document.getElementById(i)};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){["setup","game","end","list"].forEach(function(x){$(x).classList.toggle("hide",x!==id)})}

function init(data){
  ALL=data; $("cnt").textContent="Vprašanj v bazi: "+ALL.length+".";
  var temas=[],seen={};ALL.forEach(function(q){if(!seen[q.tema]){seen[q.tema]=1;temas.push(q.tema)}});
  var s=$("tema");s.innerHTML="";
  var o=document.createElement("option");o.value="";o.textContent="Vse teme ("+ALL.length+")";s.appendChild(o);
  temas.forEach(function(t){var n=ALL.filter(function(q){return q.tema===t}).length;var op=document.createElement("option");op.value=t;op.textContent=t+" ("+n+")";s.appendChild(op)});
  var gs=[],gseen={};ALL.forEach(function(q){if(q.skupina&&!gseen[q.skupina]){gseen[q.skupina]=1;gs.push(q.skupina)}});
  var sg=$("skup");sg.innerHTML="";var og=document.createElement("option");og.value="";og.textContent="Vse vrste ("+ALL.length+")";sg.appendChild(og);
  gs.forEach(function(g){var n=ALL.filter(function(q){return q.skupina===g}).length;var op=document.createElement("option");op.value=g;op.textContent=g+" ("+n+")";sg.appendChild(op)});
  updSt();
}
function pool(){var t=$("tema").value,g=$("skup").value;return ALL.filter(function(q){return(!t||q.tema===t)&&(!g||q.skupina===g)})}
function updSt(){
  var n=pool().length, s=$("st"); s.innerHTML="";
  [10,20,40,60,100].forEach(function(k){if(k<n){var o=document.createElement("option");o.value=k;o.textContent=k;s.appendChild(o)}});
  var o=document.createElement("option");o.value=n;o.textContent="Vsa ("+n+")";s.appendChild(o);
  s.selectedIndex=s.options.length-1;
}
function begin(list){
  cur=list;idx=0;score=0;wrongs=[];show("game");render();
}
function render(){
  locked=false;var q=cur[idx];
  $("prog").textContent="Vprašanje "+(idx+1)+" / "+cur.length;
  $("score").textContent="Pravilnih: "+score;
  $("barfill").style.width=(idx/cur.length*100)+"%";
  $("qtema").textContent=q.tema+(q.skupina?" · "+q.skupina:"");
  $("qtext").textContent=q.vprasanje;
  var ans=shuffle([q.pravilen].concat(q.napacni)), box=$("opts");box.innerHTML="";
  ans.forEach(function(a,i){
    var b=document.createElement("button");b.className="opt";b.type="button";
    b.innerHTML="<b>"+"ABCD"[i]+"</b>";b.appendChild(document.createTextNode(a));
    b.dataset.v=a;b.onclick=function(){pick(b,q)};box.appendChild(b);
  });
  $("fb").className="fb hide";$("next").disabled=true;
  $("next").textContent=idx===cur.length-1?"Končaj ✓":"Naprej →";
}
function pick(btn,q){
  if(locked)return;locked=true;
  var ok=btn.dataset.v===q.pravilen;
  Array.prototype.forEach.call($("opts").children,function(b){
    b.disabled=true;
    if(b.dataset.v===q.pravilen)b.classList.add("ok");
  });
  var fb=$("fb");
  if(ok){score++;fb.className="fb ok";fb.textContent="✔ Pravilno!"}
  else{btn.classList.add("bad");wrongs.push(q);fb.className="fb bad";fb.textContent="✘ Narobe. Pravilen odgovor: "+q.pravilen}
  if(q.pojasnilo){var s=document.createElement("small");s.textContent=q.pojasnilo;fb.appendChild(s)}
  $("score").textContent="Pravilnih: "+score;
  $("next").disabled=false;$("next").focus();
}
function finish(){
  show("end");var n=cur.length,p=Math.round(score/n*100);
  $("res").textContent=score+" / "+n+" ("+p+" %)";
  $("resmsg").textContent=p>=90?"Odlično! Pravi strokovnjak! 🏆":p>=70?"Zelo dobro! 👍":p>=50?"Dobro, še malo vaje. 📚":"Ponovi snov in poskusi znova. 💪";
  var w=$("wrong");w.innerHTML="";
  wrongs.forEach(function(q){var li=document.createElement("li");li.appendChild(document.createTextNode(q.vprasanje+" "));var b=document.createElement("b");b.textContent="→ "+q.pravilen;li.appendChild(b);w.appendChild(li)});
  $("wrongbox").classList.toggle("hide",!wrongs.length);$("retry").classList.toggle("hide",!wrongs.length);
}
function showList(){
  var L=pool(),b=$("lbody");b.innerHTML="";
  $("lhead").textContent="Vsi odgovori ("+L.length+" vprašanj)";
  L.forEach(function(q,i){
    var d=document.createElement("div");d.className="li";
    var h=document.createElement("div");h.className="lq";h.textContent=(i+1)+". "+q.vprasanje;d.appendChild(h);
    [q.pravilen].concat(q.napacni).forEach(function(a,k){
      var o=document.createElement("div");o.className="lo"+(k===0?" ok":"");o.textContent=(k===0?"✔ ":"✘ ")+a;d.appendChild(o)});
    if(q.pojasnilo){var p=document.createElement("div");p.className="lp";p.textContent=q.pojasnilo;d.appendChild(p)}
    var m=document.createElement("div");m.className="lp";m.textContent=q.tema+(q.skupina?" · "+q.skupina:"");d.appendChild(m);
    b.appendChild(d)});
  show("list");window.scrollTo(0,0);
}
$("showall").onclick=showList;$("lback").onclick=$("lback2").onclick=function(){show("setup")};
$("tema").onchange=updSt;$("skup").onchange=updSt;
$("start").onclick=function(){var n=parseInt($("st").value,10);begin(shuffle(pool()).slice(0,n))};
$("next").onclick=function(){if(idx<cur.length-1){idx++;render()}else finish()};
$("quit").onclick=function(){if(confirm("Prekinem kviz?"))show("setup")};
$("again").onclick=function(){show("setup")};
$("retry").onclick=function(){begin(shuffle(wrongs))};
document.addEventListener("keydown",function(e){
  if($("game").classList.contains("hide"))return;
  var k=e.key.toLowerCase(),m={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3};
  if(!locked&&k in m){var b=$("opts").children[m[k]];if(b)b.click()}
  else if(locked&&(e.key==="Enter"||e.key==="ArrowRight")){$("next").click()}
});

function setTheme(m,save){
  document.documentElement.setAttribute("data-theme",m);
  $("thL").classList.toggle("on",m==="light");$("thD").classList.toggle("on",m==="dark");
  if(save){try{localStorage.setItem("kviz-tema",m)}catch(e){}}
}
var sv=null;try{sv=localStorage.getItem("kviz-tema")}catch(e){}
setTheme(sv==="light"||sv==="dark"?sv:(window.matchMedia&&matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"),false);
$("thL").onclick=function(){setTheme("light",true)};$("thD").onclick=function(){setTheme("dark",true)};

var emb=JSON.parse($("embedded").textContent);
fetch("vprasanja.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(init).catch(function(){init(emb)});
})();
</script>
</body>
